# Dependabot version updates. This file must live at .github/dependabot.yml —
# it sat under .github/ISSUE_TEMPLATE/ for years, where GitHub never read it.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      dev-dependencies:
        dependency-type: 'development'
      production-dependencies:
        dependency-type: 'production'
    ignore:
      # The peer ranges of eslint-plugin-jsx-a11y 6.10 and eslint-plugin-react 7.37 stop at
      # ESLint 9, so an ESLint 10 bump fails `npm ci` (PR #32, 11 September 2026). This also mutes
      # a security bump that needs the major. Drop it once BOTH of these print a range with ^10:
      #   npm view eslint-plugin-jsx-a11y peerDependencies.eslint
      #   npm view eslint-plugin-react peerDependencies.eslint
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
